bundle:
  name: gl_cdc_lakehouse

include:
  - resources/*.yml

# Every catalog, path and schedule derives from `env`.
variables:
  env:
    description: Environment name, dev or prod
  landing_bucket:
    description: S3 bucket holding CDC landing files, created by Terraform
    default: gl-cdc-lakehouse-anuj
  catalog:
    description: Unity Catalog catalog for this environment
    default: gl_${var.env}
  landing_root:
    description: Landing prefix for this environment, covered by the gl_<env>_landing location
    default: s3://${var.landing_bucket}/${var.env}/cdc
  # No default, so the address never lands in the repo. Set it per shell with
  # `export BUNDLE_VAR_alert_email=...`, and as a secret in CI.
  alert_email:
    description: Address that receives pipeline and job failure emails
  # Paused by default: an idle prod still bills every scheduled serverless update.
  # Unpause with `--var schedule_pause=UNPAUSED` on deploy. Development mode pauses
  # schedules in dev regardless.
  schedule_pause:
    description: PAUSED or UNPAUSED, for every schedule in this bundle
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: gl-dev
    variables:
      env: dev

  prod:
    mode: production
    workspace:
      profile: gl-prod
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env: prod

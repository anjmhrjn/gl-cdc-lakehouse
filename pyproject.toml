[project]
name = "gl-cdc-lakehouse"
version = "0.1.0"
description = "CDC pipeline for general ledger data on Databricks"
requires-python = "==3.11.*"
dependencies = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pyspark==4.0.1",
    "chispa>=0.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# src/ is the pipeline root_path on Databricks, so modules import as `transforms.cdc` in
# both places.
pythonpath = [".", "src", "tests/unit"]

[tool.ruff.lint.isort]
known-first-party = ["generator", "jobs", "transforms", "conftest"]

[tool.ruff.lint.per-file-ignores]
# The pipeline runtime injects `spark` as a global into pipeline source files.
"src/pipelines/*.py" = ["F821"]

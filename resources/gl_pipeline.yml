resources:
  pipelines:
    gl_pipeline:
      name: gl_pipeline_${var.env}
      catalog: ${var.catalog}
      # Default schema only. Tables are written with fully qualified names so one
      # pipeline can publish to bronze, silver and gold.
      schema: silver
      serverless: true
      # Never continuous. Dev is triggered by hand; the gl_pipeline_scheduled job runs
      # it on a schedule (resources/reliability.yml).
      continuous: false
      notifications:
        - email_recipients:
            - ${var.alert_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure
      channel: CURRENT
      # src/ goes on sys.path, so pipeline files import `transforms.cdc` exactly as the
      # unit tests do.
      root_path: ../src
      libraries:
        - glob:
            include: ../src/pipelines/**
      configuration:
        gl.catalog: ${var.catalog}
        gl.landing_root: ${var.landing_root}
        gl.max_files_per_trigger: ${var.max_files_per_trigger}
        gl.journal_target_file_size: ${var.journal_target_file_size}

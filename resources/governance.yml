resources:
  jobs:
    governance:
      name: governance_${var.env}
      description: Applies sql/governance (mask and filter functions, tags, masks, row filters, grants) to the environment's catalog. Run after the pipeline has created the tables.
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
      tasks:
        - task_key: apply
          environment_key: default
          # Transient errors only: every statement is idempotent, so a retry is safe.
          # The Jobs API retries at a fixed interval, not an increasing one, so this is
          # the closest it gets to backoff.
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: false
          spark_python_task:
            python_file: ../src/jobs/governance.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --sql-dir
              - ${workspace.file_path}/sql/governance

    governance_check:
      name: governance_check_${var.env}
      description: Integration test. Checks tags, masks, row filters and grants in information_schema.
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
      tasks:
        - task_key: check
          environment_key: default
          spark_python_task:
            python_file: ../tests/integration/governance_check.py
            parameters:
              - --catalog
              - ${var.catalog}
